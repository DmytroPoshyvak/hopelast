apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Values.todoapp.namespace }}
spec:
  strategy:
    type: {{ .Values.todoapp.strategy.type }}
    rollingUpdate:
      maxSurge: {{ .Values.todoapp.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ .Values.todoapp.strategy.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      serviceAccountName: {{ .Values.todoapp.serviceAccountName }}
      containers:
      - name: todoapp
        image: "{{ .Values.todoapp.image.name }}:{{ .Values.todoapp.image.tag }}"
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: app-secrets-volume
          mountPath: "/app/secrets"
          readOnly: true
        - name: app-config-volume
          mountPath: "/app/configs"
          readOnly: true
        resources:
          requests:
            memory: {{ .Values.todoapp.resources.requests.memory }}
            cpu: {{ .Values.todoapp.resources.requests.cpu }}
          limits:
            memory: {{ .Values.todoapp.resources.limits.memory }}
            cpu: {{ .Values.todoapp.resources.limits.cpu }}
        env:
        {{- range $k, $v := .Values.todoapp.configmap }}
        - name: {{ $k }}
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: {{ $v }}
        {{- end }}
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: api/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pvc-data
      - name: app-secrets-volume
        secret:
          secretName: app-secret
      - name: app-config-volume
        configMap:
          name: app-config
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: {{ .Values.todoapp.affinity.weight }}
            preference:
              matchExpressions:
              - key: {{ .Values.todoapp.affinity.key }}
                operator: In
                values:
                {{- range .Values.todoapp.affinity.values }}
                - {{ . | quote }}
                {{- end }}