mysql:
  namespace: mysql

  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: app_user
    MYSQL_PASSWORD: "1234"

  replicas: 2

  image:
    name: mysql
    tag: 8.0

  storage: 2Gi

  tolerations:
    key: "app"
    value: "mysql"
    effect: "NoSchedule"

  affinity:
    key: "app"
    value: "mysql"

  resources:
    requests:
      cpu: 500m
      memory: 1Gi